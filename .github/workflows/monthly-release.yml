name: Monthly Wikidata ID release

on:
  schedule:
    - cron: "23 3 1 * *"
      timezone: "Etc/UTC"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-wikidata-id-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test builder
        run: python3 -m unittest discover -s tests -v

      - name: Download identifiers and build database
        run: >-
          python3 build_release.py
          --work-dir build/tsv
          --output-dir dist
          --user-agent "MediaSyncIDData/1.0 (+https://github.com/${GITHUB_REPOSITORY})"

      - name: Publish monthly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y-%m)"
          title="MediaSync ID data $(date -u +%Y-%m)"
          notes="Monthly Wikidata external-ID snapshot generated from truthy statements. See manifest.json for counts, checksums, and source metadata."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest
          fi
